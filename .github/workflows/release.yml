name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  release:
    permissions:
      contents: write
      attestations: read
    name: Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: falcon-cli-*
          path: artifacts
          merge-multiple: true
      - name: Verify release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            gh attestation verify "artifacts/falcon-cli-${target}.tar.gz" \
              --repo "$GITHUB_REPOSITORY" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_SHA" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
              --deny-self-hosted-runners
            cp "artifacts/falcon-cli-${target}.tar.gz" release/
          done
      - name: Generate checksums
        run: |
          cd release
          sha256sum falcon-cli-*.tar.gz > sha256sums.txt
      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/falcon-cli-*.tar.gz release/sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --draft
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
