[package]
name = "falcon-cli"
version = "0.9.1"
edition = "2021"
license = "MIT"
description = "A CLI tool for CrowdStrike Falcon API"
repository = "https://github.com/hiboma/falcon-cli"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
clap_complete = "4.6.2"
base64 = "0.22"
rpassword = "7"
tempfile = "3"
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# Same major as the version that `keyring`'s apple-native backend pulls
# in for macOS, so that downcasting the boxed error inside
# keyring::Error::PlatformFailure resolves to the same `Error` type.
security-framework = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
